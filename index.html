<title>Notes</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --text:#14181f; --muted:#667085; --faint:#98a2b3;
    --line:#e4e7ec; --accent:#2f4b7c; --accent-soft:#e8edf5; --warn:#b54708; --warn-soft:#fef0e1;
    --pass:#15803d; --pass-soft:#e7f4ec; --fail:#b42318; --fail-soft:#fbeae8;
    --s1:#2f4b7c; --s2:#5b77a8; --s3:#9db0cf; --s4:#3f6a8a; --s5:#7d93b8; --s6:#c2cee2;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1116; --surface:#161b22; --surface-2:#1d232c; --text:#e6e9ef; --muted:#97a1b0; --faint:#6b7480;
      --line:#262d38; --accent:#8fb0e8; --accent-soft:#1d2a3f; --warn:#f5a524; --warn-soft:#3a2a10;
      --pass:#4ade80; --pass-soft:#14301f; --fail:#f87171; --fail-soft:#3a1717;
      --s1:#8fb0e8; --s2:#5f7fb5; --s3:#3b5379; --s4:#a9c2ec; --s5:#4a6797; --s6:#2c3e5c;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       background:var(--bg);color:var(--text);padding-bottom:calc(32px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  /* Header */
  header{position:sticky;top:0;z-index:10;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);
         backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
         border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .hwrap{max-width:640px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:10px;min-height:36px}
  .back{border:0;background:none;color:var(--accent);font-size:16px;font-weight:600;padding:6px 6px 6px 0;cursor:pointer;display:flex;align-items:center;gap:2px}
  .back svg{width:20px;height:20px}
  .ttl{flex:1;min-width:0}
  .ttl h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl span{display:block;font-size:12px;color:var(--muted)}
  .logo{width:34px;height:34px;flex:none}
  .act{border:0;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer}
  nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px;font-weight:600;
             padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  nav button.active{background:var(--text);border-color:var(--text);color:var(--bg)}

  main{max-width:640px;margin:0 auto;padding:16px}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .card-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px}
  .card-title h3{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
  .chip{font-size:12px;font-weight:650;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
  .gval{font-size:13px;color:var(--muted);margin:-6px 0 8px}
  .gval b{color:var(--text)}

  /* Home */
  .home-hero{display:flex;align-items:center;gap:14px;margin:8px 2px 20px}
  .home-hero svg{width:56px;height:56px;flex:none}
  .home-hero h2{margin:0;font-size:24px;letter-spacing:-.02em}
  .home-hero p{margin:2px 0 0;color:var(--muted);font-size:14px}
  .quad{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;background:var(--surface);
        border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .quad .badge{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
               display:flex;align-items:center;justify-content:center;font-weight:750;font-size:16px;flex:none}
  .quad .info{flex:1;min-width:0}
  .quad .info b{display:block;font-size:16px}
  .quad .info small{color:var(--muted);font-size:13px}
  .quad .avgv{font-size:22px;font-weight:720;letter-spacing:-.02em}
  .chev{color:var(--faint);font-size:20px;line-height:1}

  /* Subject */
  .subj-head{margin:4px 2px 14px}
  .subj-head .code{font-size:12px;font-weight:650;color:var(--accent);letter-spacing:.06em}
  .subj-head h2{font-size:22px;margin:2px 0 0;letter-spacing:-.02em;font-weight:680}
  .hero{display:flex;align-items:center;gap:16px}
  .hero .big{font-size:44px;font-weight:720;letter-spacing:-.03em;line-height:1;min-width:110px}
  .hero .big small{font-size:16px;font-weight:600;color:var(--faint);letter-spacing:0;margin-left:2px}
  .hero .meta{flex:1;min-width:0}
  .status{display:inline-block;font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;
          padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
  .status.pass{background:var(--pass-soft);color:var(--pass)}
  .status.fail{background:var(--fail-soft);color:var(--fail)}
  .hero .sub{font-size:13px;color:var(--muted);margin-top:6px}
  .c-pass{color:var(--pass)} .c-fail{color:var(--fail)} .c-none{color:var(--faint)} .c-neutral{color:var(--text)}
  .progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:14px}
  .progress > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
  .progress-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
  .hint{margin-top:12px;font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px;line-height:1.45}
  .hint:empty{display:none}
  .hint p{margin:0} .hint p + p{margin-top:6px}

  .wbar{display:flex;gap:3px;height:10px;margin-bottom:10px}
  .wbar .seg{position:relative;border-radius:3px;overflow:hidden;background:var(--surface-2)}
  .wbar .seg i{position:absolute;inset:0 auto 0 0;transition:width .3s}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
  .legend div{display:flex;align-items:center;gap:6px}
  .legend b{font-weight:650}
  .legend .dot{width:9px;height:9px;border-radius:2px}
  .wnote{font-size:12.5px;color:var(--muted);margin-top:10px}
  .warn{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin-top:10px}

  /* Inputs */
  .field{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .field:first-child{border-top:0}
  .field .lbl{flex:1;min-width:0}
  .field .lbl div{font-size:15px}
  .field .lbl small{display:block;font-size:12px;color:var(--muted)}
  .w{font-size:12px;font-weight:650;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:6px;white-space:nowrap}
  .w.alt{color:var(--muted);background:var(--surface-2)}
  input[type=number]{width:78px;font:inherit;font-size:17px;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
       background:var(--surface-2);color:var(--text);text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield;flex:none}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{outline:none;border-color:var(--accent)!important;background:var(--surface)!important;box-shadow:0 0 0 3px var(--accent-soft)}
  input::placeholder{color:var(--faint);font-weight:400}
  input.bad{border-color:var(--fail);box-shadow:0 0 0 3px var(--fail-soft)}
  .box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
  .box .box{margin-left:0}
  .box-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
  .box-head b{font-size:14px}
  .box-head .r{display:flex;align-items:center;gap:8px}
  .box-head .gv{font-weight:650;font-size:14px;min-width:38px;text-align:right}
  .box.off > .field, .box.off > .box{opacity:.4;pointer-events:none}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted);padding:6px 0;cursor:pointer}
  .switch input{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
  .switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
  .switch input:checked{background:var(--accent)}
  .switch input:checked::after{transform:translateX(16px)}
  .formula{font:12.5px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--muted);white-space:pre-wrap;margin:0}

  /* Summary */
  .srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
  .srow:first-child{border-top:0;padding-top:2px}
  .srow .info{flex:1;min-width:0}
  .srow .info .n{font-weight:600;font-size:15px}
  .srow .info .c{font-size:12px;color:var(--muted)}
  .mini{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:7px}
  .mini i{display:block;height:100%;background:var(--accent)}
  .srow .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .avg{display:flex;justify-content:space-between;align-items:center}
  .avg .v{font-size:28px;font-weight:720;letter-spacing:-.02em}
  .avg small{display:block;color:var(--muted);font-size:12.5px}
  .empty{text-align:center;padding:28px 12px;color:var(--muted)}
  .empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

  .btn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;margin-bottom:10px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme:dark){ .btn.primary{color:#0e1116} }
  .btn.danger{color:var(--fail)}
  .btn.ghost{color:var(--muted)}
  .foot{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 14px}

  /* Editor */
  .ef{display:block;margin-bottom:12px}
  .ef span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .ef input[type=text], .ef input[type=number]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
       background:var(--surface-2);color:var(--text);text-align:left}
  .ef small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  .trow{display:flex;align-items:center;gap:8px;padding:10px 0 10px calc(var(--d) * 18px);border-top:1px solid var(--line);cursor:pointer}
  .trow .ti{width:16px;color:var(--faint);text-align:center;flex:none}
  .trow .tn{flex:1;min-width:0;font-size:15px}
  .trow .tn.g{font-weight:650}
  .trow .tn small{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .trow .tw{font-size:13px;font-weight:650;color:var(--accent)}
  .trow .te{color:var(--faint);font-size:15px}
  .tadd{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px calc(var(--d) * 18px + 24px)}
  .tadd button{white-space:nowrap;border:1px dashed var(--line);background:none;color:var(--accent);font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer}
  .twarn{font-size:12px;color:var(--warn);padding:0 0 6px calc(var(--d) * 18px + 24px)}
  .help{font-size:13px;color:var(--muted);line-height:1.5}
  .help p{margin:0 0 6px}

  /* Sheet */
  .sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet-bg{position:absolute;inset:0;background:rgba(10,14,20,.45)}
  .sheet-panel{position:relative;width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--surface);
        border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:0}}
  .sheet-panel h4{margin:0 0 14px;font-size:17px}
  .row2{display:flex;gap:8px}
  .row2 .btn{margin-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="bar" id="bar"></div>
    <nav id="tabs" class="hidden"></nav>
  </div>
</header>
<main id="main"></main>
<div id="sheet" class="sheet hidden"><div class="sheet-bg"></div><div class="sheet-panel" id="sheet-panel"></div></div>

<script>
/* =================== Logo =================== */
const LOGO = `<svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#2f4b7c"/>
<rect x="23" y="58" width="15" height="20" rx="4" fill="#fff" fill-opacity=".5"/><rect x="42.5" y="44" width="15" height="34" rx="4" fill="#fff" fill-opacity=".75"/>
<rect x="62" y="28" width="15" height="50" rx="4" fill="#fff"/><circle cx="69.5" cy="17" r="5" fill="#9db0cf"/></svg>`;

/* =================== Dades =================== */
const STORE = "notes-app-v2", OLD = "notes-q1-v1";
const uid = () => Math.random().toString(36).slice(2, 10);
const L = (id, name, w, x = {}) => ({ id, type: "leaf", name, w, ...x });
const G = (id, name, w, children, x = {}) => ({ id, type: "group", name, w, children, ...x });

function defaultQ1() {
  return [
    { id: "pro1", name: "Programació", code: "PRO1", children: [
      L("pro1.P", "Examen parcial", 40, { np: true }),
      L("pro1.F", "Examen final", 60, { replace: true, np: true, desc: "Si és més alta que la mitjana ponderada, compta el 100%" }),
    ]},
    { id: "fm", name: "Fonaments Matemàtics", code: "FM", children: [
      G("fm.par", "Parcials", 80, [L("fm.P1", "Parcial 1", 50), L("fm.P2", "Parcial 2", 50)]),
      G("fm.lab", "Laboratori", 20, [L("fm.L1", "Prova de laboratori 1", 50), L("fm.L2", "Prova de laboratori 2", 50)]),
      L("fm.F", "Examen final", 0, { replace: true, desc: "Opcional · si és més alta, substitueix tota la nota" }),
    ]},
    { id: "fis", name: "Física", code: "FIS", children: [
      G("fis.teo", "Teoria", 90, [
        L("fis.P1", "Parcial 1", 50, { desc: "Temes 1 i 2" }),
        L("fis.P2", "Parcial 2", 50, { desc: "Temes 3 i 4" }),
        L("fis.EF", "Examen final", 0, { replace: true, desc: "Opcional · si és més alta, substitueix la teoria" }),
      ]),
      G("fis.lab", "Laboratori", 10, [
        ...[1, 2, 3, 4, 5].map(i => L("fis.Pr" + i, "Pràctica " + i, 15)),
        L("fis.ExLab", "Examen de laboratori (oral)", 25),
      ]),
    ]},
    { id: "ic", name: "Introducció als Computadors", code: "IC", children: [
      G("ic.teo", "Teoria i problemes", 80, [
        L("ic.NP1", "Parcial 1", 40),
        L("ic.NP2", "Parcial 2", 60, { np: true }),
        L("ic.EF", "Examen final", 0, { replace: true, np: true, desc: "Opcional · si és més alta, substitueix la teoria" }),
      ]),
      G("ic.lab", "Laboratori", 20, [1, 2, 3, 4, 5, 6].map(i =>
        G("ic.lab" + i, "Pràctica " + i, 100 / 6, [L("ic.PP" + i, "Prova prèvia", 65), L("ic.IF" + i, "Informe final", 35)],
          { gate: "Informe previ entregat", np: i >= 3 }))),
    ]},
  ];
}
const freshState = () => ({ quads: [
  { id: "q1", short: "Q1", name: "1r quadrimestre", subjects: defaultQ1() },
  { id: "q2", short: "Q2", name: "2n quadrimestre", subjects: [] },
]});

function walk(n, fn, parent = null) { fn(n, parent); (n.children || []).forEach(c => walk(c, fn, n)); }

function load() {
  let st = null;
  try { st = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
  if (st && st.quads) return st;
  st = freshState();
  let old = null;
  try { old = JSON.parse(localStorage.getItem(OLD)); } catch (e) {}
  if (old) st.quads[0].subjects.forEach(s => walk(s, n => {
    if (n.type === "leaf" && typeof old[n.id] === "number") n.v = old[n.id];
    const m = /^ic\.lab(\d)$/.exec(n.id);
    if (m && old["ic.inf" + m[1]] === false) n.gateOn = false;
  }));
  return st;
}
let state = load();
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
save();

/* =================== Utilitats =================== */
const has = v => typeof v === "number" && !isNaN(v);
const r2 = v => Math.round(v * 100) / 100;
const fmt = v => (has(v) ? r2(v).toFixed(2).replace(".", ",") : "—");
const pct = f => (Math.round(f * 10000) / 100).toString().replace(".", ",") + "%";
const pctW = w => (Math.round(w * 100) / 100).toString().replace(".", ",") + "%";
const dec = w => (Math.round(w / 100 * 10000) / 10000).toString().replace(".", ",");
const ceil2 = x => Math.ceil(x * 100 - 1e-9) / 100;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

/* =================== Càlcul =================== */
const isLeaf = n => n.type === "leaf";
const gateOff = n => !!n.gate && n.gateOn === false;
// Punts assegurats (el que falta compta com a 0)
function val(n) {
  if (isLeaf(n)) return has(n.v) ? n.v : 0;
  if (gateOff(n)) return 0;
  let s = 0;
  for (const c of n.children) s += (c.w / 100) * val(c);
  for (const c of n.children) if (isLeaf(c) && c.replace && has(c.v)) s = Math.max(s, c.v);
  return s;
}
// Fracció avaluada (0..1)
function evl(n) {
  if (isLeaf(n)) return has(n.v) ? 1 : 0;
  if (gateOff(n)) return 1;
  if (n.children.some(c => isLeaf(c) && c.replace && has(c.v))) return 1;
  let e = 0;
  for (const c of n.children) e += (c.w / 100) * evl(c);
  return Math.min(1, e);
}
const filled = n => (isLeaf(n) ? has(n.v) : gateOff(n) || n.children.some(filled));
const hasReplacerPending = n => { let r = false; walk(n, c => { if (isLeaf(c) && c.replace && !has(c.v)) r = true; }); return r; };

function summary(s) {
  const S = val(s), E = evl(s), any = filled(s);
  const complete = E >= 0.999;
  const max = hasReplacerPending(s) && !complete ? 10 : Math.min(10, S + (1 - E) * 10);
  return { S, E, any, complete, max };
}

function hints(s) {
  const out = [];
  if (!filled(s)) return out;
  const S = val(s), E = evl(s), R = Math.max(0, 1 - E);
  if (S >= 5 - 1e-9) out.push(E >= 0.999 ? "Assignatura aprovada 🎉" : "Ja tens el 5 assegurat 🎉 El que falta només pot pujar la nota.");
  else {
    let x = null;
    if (R > 0.001) {
      x = (5 - S) / R;
      out.push(x <= 10 ? `Et cal una mitjana de <b>${fmt(ceil2(x))}</b> en el que queda (${pct(R)} de la nota).`
                       : `Ni amb un 10 en tot el que queda (${pct(R)} de la nota) arribaries al 5.`);
    }
    (function rec(g, eff) {
      for (const c of g.children) {
        if (isLeaf(c)) {
          if (c.replace && !has(c.v) && eff > 0) {
            const r = (5 - (S - eff * val(g))) / eff;
            if (r <= 10 && (c.w === 0 || x === null || r < x - 1e-9)) {
              const pre = x !== null && x <= 10 ? "O bé un" : "Pots aprovar amb un";
              out.push(`${pre} <b>${fmt(ceil2(Math.max(0, r)))}</b> a «${esc(c.name)}»${eff < 0.999 && R > 0.001 ? " (comptant la resta del que falta com a 0)" : ""}.`);
            }
          }
        } else if (!gateOff(c)) rec(c, eff * c.w / 100);
      }
    })(s, 1);
    if (R <= 0.001 && out.length === 0) out.push("Amb aquestes notes l'assignatura queda suspesa.");
  }
  const np = [];
  walk(s, n => { if (n !== s && n.np) np.push(n); });
  if (np.length && !np.some(filled)) out.push(`Si no et presentes a cap d'aquestes proves, la nota serà <b>NP</b>: ${np.map(n => esc(n.name)).join(", ")}.`);
  return out;
}

function formulas(s) {
  const lines = [];
  const rhs = g => {
    const parts = g.children.filter(c => c.w > 0);
    let e;
    const eq = parts.length >= 3 && parts.every(c => Math.abs(c.w - parts[0].w) < 0.01) && Math.abs(parts.reduce((a, c) => a + c.w, 0) - 100) < 0.1;
    if (!parts.length) e = "0";
    else if (eq) e = `mitjana(${parts.length > 3 ? parts[0].name + " … " + parts[parts.length - 1].name : parts.map(c => c.name).join(", ")})`;
    else e = parts.map(c => `${dec(c.w)}·${c.name}`).join(" + ");
    const reps = g.children.filter(c => isLeaf(c) && c.replace);
    const repsAlone = reps.filter(c => !(c.w > 0 && parts.length === 1));
    if (repsAlone.length) e = `max(${e}, ${repsAlone.map(c => c.name).join(", ")})`;
    if (g.gate) e += `   (0 sense «${g.gate}»)`;
    return e;
  };
  (function rec(g, name) {
    lines.push(`${name} = ${rhs(g)}`);
    const groups = g.children.filter(c => !isLeaf(c));
    const byR = new Map();
    for (const c of groups) { const k = rhs(c); if (!byR.has(k)) byR.set(k, []); byR.get(k).push(c); }
    for (const [, list] of byR) {
      if (list.length === 1) rec(list[0], list[0].name);
      else {
        const nm = list.length > 2 ? `${list[0].name} … ${list[list.length - 1].name}` : list.map(c => c.name).join(", ");
        rec(list[0], nm);
      }
    }
  })(s, "Nota");
  return lines.join("\n");
}

/* =================== Navegació =================== */
const bar = $("bar"), tabs = $("tabs"), main = $("main");
const BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
const getQ = id => state.quads.find(q => q.id === id);
const go = h => { location.hash = h; };

function route() {
  closeSheet();
  const [qid, sid, mode] = location.hash.replace(/^#/, "").split("/");
  const q = qid && getQ(qid);
  if (!q) return renderHome();
  if (!sid) return renderQuad(q);
  const s = q.subjects.find(x => x.id === sid);
  if (!s) return go(q.id);
  if (mode === "edit") return renderEdit(q, s);
  renderSubject(q, s);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

function setHeader({ back, title, sub, action, logo }) {
  bar.innerHTML = (back ? `<button class="back" id="h-back">${BACK}${esc(back.label)}</button>` : "") +
    (logo ? LOGO : "") +
    `<div class="ttl"><h1>${esc(title)}</h1>${sub ? `<span>${esc(sub)}</span>` : ""}</div>` +
    (action ? `<button class="act" id="h-act">${esc(action.label)}</button>` : "");
  if (back) $("h-back").onclick = () => go(back.to);
  if (action) $("h-act").onclick = action.fn;
}
function setTabs(q, activeId) {
  if (!q) { tabs.classList.add("hidden"); return; }
  tabs.classList.remove("hidden");
  tabs.innerHTML = `<button data-go="${q.id}" class="${activeId ? "" : "active"}">Resum</button>` +
    q.subjects.map(s => `<button data-go="${q.id}/${s.id}" class="${s.id === activeId ? "active" : ""}">${esc(s.code || s.name)}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.go));
  const a = tabs.querySelector(".active");
  if (a) a.scrollIntoView({ inline: "center", block: "nearest" });
}

const gradeCls = (v, complete) => (!has(v) ? "c-none" : r2(v) >= 5 ? "c-pass" : complete ? "c-fail" : "c-neutral");

function quadAvg(q) {
  const xs = q.subjects.map(summary).filter(r => r.any);
  return xs.length ? { v: xs.reduce((a, r) => a + r.S, 0) / xs.length, n: xs.length } : null;
}

/* =================== Pantalla: inici =================== */
function renderHome() {
  setHeader({ title: "Calculadora de notes", logo: true });
  setTabs(null);
  main.innerHTML = `
    <div class="home-hero">${LOGO.replace('class="logo"', "")}<div><h2>Hola! 👋</h2><p>Tria el quadrimestre que estàs cursant.</p></div></div>
    ${state.quads.map(q => {
      const a = quadAvg(q);
      const n = q.subjects.length;
      return `<button class="quad" data-q="${q.id}">
        <div class="badge">${esc(q.short)}</div>
        <div class="info"><b>${esc(q.name)}</b><small>${n ? `${n} assignatur${n === 1 ? "a" : "es"}` : "Cap assignatura encara"}${a ? " · mitjana provisional" : ""}</small></div>
        ${a ? `<span class="avgv num ${gradeCls(a.v)}">${fmt(a.v)}</span>` : ""}<span class="chev">›</span></button>`;
    }).join("")}
    <p class="foot">Les notes es guarden en aquest dispositiu.</p>`;
  main.querySelectorAll(".quad").forEach(b => b.onclick = () => go(b.dataset.q));
}

/* =================== Pantalla: quadrimestre =================== */
function renderQuad(q) {
  setHeader({ back: { label: "Inici", to: "" }, title: q.name, sub: q.short });
  setTabs(q, null);
  const rows = q.subjects.map(s => {
    const r = summary(s);
    let v = "—", tag = "Sense notes";
    if (r.any) { v = fmt(r.S); tag = r.complete ? (r.S >= 5 ? "Aprovada" : "Suspesa") : r.S >= 5 ? "Aprovada · ja assegurat" : `Provisional · ${pct(r.E)} avaluat`; }
    return `<div class="srow" data-go="${q.id}/${s.id}">
      <div class="info"><div class="n">${esc(s.name)}</div><div class="c">${esc(s.code)} · ${tag}</div><div class="mini"><i style="width:${r.E * 100}%"></i></div></div>
      <span class="v num ${r.any ? gradeCls(r.S, r.complete) : "c-none"}">${v}</span><span class="chev">›</span></div>`;
  }).join("");
  const a = quadAvg(q);
  main.innerHTML = q.subjects.length ? `
    <div class="card"><div class="card-title"><h3>Assignatures</h3></div>${rows}</div>
    <div class="card avg"><div><b>Mitjana provisional</b><small>${a ? `Mitjana de ${a.n} assignatur${a.n === 1 ? "a" : "es"} amb nota` : "Encara no hi ha notes"}</small></div><span class="v num ${a ? gradeCls(a.v) : "c-none"}">${a ? fmt(a.v) : "—"}</span></div>
    <p class="foot">La nota provisional són els punts que ja tens sobre 10: el que encara no has fet compta com a 0.</p>
    <button class="btn primary" id="add-subj">+ Afegir assignatura</button>
    <button class="btn danger" id="clear">Esborrar les notes de ${esc(q.short)}</button>
    ${q.id === "q1" ? `<button class="btn ghost" id="restore">Restaurar les assignatures originals de Q1</button>` : ""}`
  : `<div class="card empty"><b>Encara no hi ha assignatures</b>Crea-les amb els seus exàmens, pràctiques i ponderacions.</div>
     <button class="btn primary" id="add-subj">+ Afegir assignatura</button>`;
  main.querySelectorAll(".srow").forEach(r => r.onclick = () => go(r.dataset.go));
  $("add-subj").onclick = () => {
    const s = { id: uid(), name: "Nova assignatura", code: "NOVA", children: [L(uid(), "Examen parcial", 40), L(uid(), "Examen final", 60)] };
    q.subjects.push(s); save(); go(`${q.id}/${s.id}/edit`);
  };
  if ($("clear")) $("clear").onclick = () => {
    if (!confirm(`Segur que vols esborrar totes les notes de ${q.short}? L'estructura de les assignatures es manté.`)) return;
    q.subjects.forEach(s => walk(s, n => { delete n.v; if (n.gate) n.gateOn = true; }));
    save(); route();
  };
  if ($("restore")) $("restore").onclick = () => {
    if (!confirm("Això tornarà a posar les 4 assignatures originals de Q1 i esborrarà els canvis i les notes de Q1. Continuar?")) return;
    q.subjects = defaultQ1(); save(); route();
  };
}

/* =================== Pantalla: assignatura =================== */
function renderSubject(q, s) {
  setHeader({ back: { label: q.short, to: q.id }, title: s.name, sub: q.name, action: { label: "Editar", fn: () => go(`${q.id}/${s.id}/edit`) } });
  setTabs(q, s.id);
  const top = s.children;
  const segs = top.filter(c => c.w > 0);
  const topSum = top.reduce((a, c) => a + c.w, 0);
  const reps = [];
  walk(s, (n, p) => { if (isLeaf(n) && n.replace) reps.push(`«${esc(n.name)}» substitueix ${p === s ? "tota la nota" : `«${esc(p.name)}»`} si és més alta.`); });

  let h = `
    <div class="subj-head"><div class="code">${esc(s.code)}</div><h2>${esc(s.name)}</h2></div>
    <div class="card">
      <div class="hero"><div class="big num" id="big">—</div>
        <div class="meta"><span class="status" id="status"></span><div class="sub" id="hsub"></div></div></div>
      <div class="progress"><i id="prog" style="width:0"></i></div>
      <div class="progress-lbl"><span id="plbl"></span><span id="pmax"></span></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="card"><div class="card-title"><h3>Ponderació</h3></div>
      <div class="wbar">${segs.map((c, i) => `<div class="seg" style="flex:${c.w}"><i id="seg-${i}" style="width:0;background:var(--s${(i % 6) + 1})"></i></div>`).join("")}</div>
      <div class="legend">${segs.map((c, i) => `<div><span class="dot" style="background:var(--s${(i % 6) + 1})"></span>${esc(c.name)} <b>${pctW(c.w)}</b></div>`).join("")}</div>
      ${reps.length ? `<div class="wnote">${reps.join("<br>")}</div>` : ""}
      ${Math.abs(topSum - 100) > 0.05 ? `<div class="warn">Els pesos sumen ${pctW(topSum)}; haurien de sumar 100%. Revisa-ho a «Editar».</div>` : ""}
    </div>`;

  // Targetes de notes
  let run = [];
  const flush = () => {
    if (!run.length) return;
    h += `<div class="card"><div class="card-title"><h3>${run.length === 1 && run[0].replace && run[0].w === 0 ? "Opcional" : "Proves"}</h3></div>${run.map(c => leafRow(c, c.w / 100, s, 1)).join("")}</div>`;
    run = [];
  };
  for (const c of top) {
    if (isLeaf(c)) { run.push(c); continue; }
    flush();
    const eff = c.w / 100;
    h += `<div class="card ${gateOff(c) ? "box off" : ""}" data-gbox="${c.id}">
      <div class="card-title"><h3>${esc(c.name)}</h3><span class="chip">${pctW(c.w)} de la nota</span></div>
      <div class="gval">Punts de l'apartat: <b class="num" id="gv-${c.id}">—</b> / 10</div>
      ${c.gate ? gateSwitch(c) : ""}
      ${c.children.map(k => (isLeaf(k) ? leafRow(k, eff * k.w / 100, c, 2) : groupBox(k, eff * k.w / 100, c, 2))).join("")}
      ${c.children.length ? "" : `<div class="wnote">Aquest apartat no té proves. Afegeix-ne a «Editar».</div>`}
    </div>`;
  }
  flush();
  if (!top.length) h += `<div class="card empty"><b>Sense proves</b>Toca «Editar» per afegir exàmens i apartats.</div>`;
  h += `<div class="card"><div class="card-title"><h3>Fórmules</h3></div><pre class="formula">${esc(formulas(s))}</pre></div>`;
  main.innerHTML = h;

  const idx = {};
  walk(s, n => { idx[n.id] = n; });
  main.querySelectorAll("input[data-id]").forEach(inp => {
    const n = idx[inp.dataset.id];
    Object.assign(inp, { min: 0, max: 10, step: "0.01", inputMode: "decimal", placeholder: "—" });
    if (has(n.v)) inp.value = n.v;
    inp.addEventListener("input", () => {
      const v = inp.value.trim();
      if (v === "") { delete n.v; inp.classList.remove("bad"); }
      else {
        const x = parseFloat(v.replace(",", "."));
        const ok = !isNaN(x) && x >= 0 && x <= 10;
        inp.classList.toggle("bad", !ok);
        if (ok) n.v = x; else delete n.v;
      }
      save(); recalc(s);
    });
  });
  main.querySelectorAll("input[data-gate]").forEach(inp => {
    const n = idx[inp.dataset.gate];
    inp.checked = !gateOff(n);
    inp.addEventListener("change", () => {
      n.gateOn = inp.checked;
      main.querySelector(`[data-gbox="${n.id}"]`).classList.toggle("off", !inp.checked);
      save(); recalc(s);
    });
  });
  recalc(s);
}

function leafRow(n, eff, parent, depth) {
  const chip = n.replace && n.w === 0 ? `<span class="w alt">Substitueix</span>` : `<span class="w">${pct(eff)}</span>`;
  const bits = [];
  if (n.desc) bits.push(esc(n.desc));
  else if (n.replace) bits.push(`Si és més alta, substitueix ${depth === 1 ? "tota la nota" : `«${esc(parent.name)}»`}`);
  if (depth >= 2 && n.w > 0) bits.push(`${pctW(n.w)} de «${esc(parent.name)}»`);
  return `<div class="field"><div class="lbl"><div>${esc(n.name)}</div>${bits.length ? `<small>${bits.join(" · ")}</small>` : ""}</div>${chip}<input type="number" data-id="${n.id}"></div>`;
}
function gateSwitch(g) {
  return `<label class="switch">${esc(g.gate)}<input type="checkbox" data-gate="${g.id}"></label>`;
}
function groupBox(g, eff, parent, depth) {
  return `<div class="box ${gateOff(g) ? "off" : ""}" data-gbox="${g.id}">
    <div class="box-head"><b>${esc(g.name)}</b><div class="r"><span class="w">${pct(eff)}</span><span class="gv num" id="gv-${g.id}">—</span></div></div>
    ${g.gate ? gateSwitch(g) : ""}
    ${g.children.map(k => (isLeaf(k) ? leafRow(k, eff * k.w / 100, g, depth + 1) : groupBox(k, eff * k.w / 100, g, depth + 1))).join("")}
  </div>`;
}

function recalc(s) {
  const r = summary(s);
  const big = $("big"), st = $("status");
  if (!r.any) {
    big.innerHTML = "—"; big.className = "big num c-none";
    st.textContent = "Sense notes"; st.className = "status";
    $("hsub").textContent = "Introdueix les notes que ja tens.";
  } else {
    big.innerHTML = `${fmt(r.S)}<small>/10</small>`;
    big.className = "big num " + gradeCls(r.S, r.complete);
    const pass = r2(r.S) >= 5;
    if (r.complete) { st.textContent = pass ? "Aprovada" : "Suspesa"; st.className = "status " + (pass ? "pass" : "fail"); }
    else if (pass) { st.textContent = "Aprovada · ja assegurat"; st.className = "status pass"; }
    else { st.textContent = "Provisional"; st.className = "status"; }
    $("hsub").textContent = r.complete ? "Nota final: tota l'assignatura està avaluada." : "Punts acumulats fins ara. El que falta compta com a 0.";
  }
  $("prog").style.width = r.E * 100 + "%";
  $("plbl").textContent = `${pct(r.E)} avaluat`;
  $("pmax").textContent = r.any && !r.complete ? `Màxim possible: ${fmt(r.max)}` : "";
  $("hint").innerHTML = hints(s).map(t => `<p>${t}</p>`).join("");
  s.children.filter(c => c.w > 0).forEach((c, i) => { const e = $("seg-" + i); if (e) e.style.width = evl(c) * 100 + "%"; });
  walk(s, n => {
    if (n === s || isLeaf(n)) return;
    const e = $("gv-" + n.id);
    if (e) e.textContent = filled(n) ? fmt(val(n)) : "—";
  });
}

/* =================== Pantalla: editor =================== */
function findWithParent(root, id) {
  let res = null;
  walk(root, (n, p) => { if (n.id === id) res = { n, p }; });
  return res;
}
const sumW = g => g.children.reduce((a, c) => a + c.w, 0);

function renderEdit(q, s) {
  setHeader({ back: { label: "Tornar", to: `${q.id}/${s.id}` }, title: "Editar assignatura", sub: s.name, action: { label: "Fet", fn: () => go(`${q.id}/${s.id}`) } });
  setTabs(null);
  main.innerHTML = `
    <div class="card">
      <div class="card-title"><h3>Assignatura</h3></div>
      <label class="ef"><span>Nom</span><input type="text" id="e-name" value="${esc(s.name)}"></label>
      <label class="ef" style="margin-bottom:0"><span>Abreviatura</span><input type="text" id="e-code" value="${esc(s.code)}" maxlength="8" style="text-transform:uppercase"></label>
    </div>
    <div class="card">
      <div class="card-title"><h3>Apartats i proves</h3><span class="chip">Toca per editar</span></div>
      <div id="tree">${treeRows(s, 0)}</div>
    </div>
    <div class="card help">
      <p><b>Com funciona:</b> cada <b>prova</b> té una nota sobre 10 i un <b>pes</b>, que és el percentatge que compta dins del seu apartat (o sobre la nota final si no és dins de cap apartat).</p>
      <p>Un <b>apartat</b> agrupa proves (per exemple «Laboratori» o «Pràctica 1»). Els pesos de dins d'un apartat han de sumar 100%.</p>
      <p>Una prova marcada com a <b>«substitueix»</b> (per exemple un examen final) es queda en lloc de tot el seu apartat si la nota és més alta. Si no ha de comptar per defecte, posa-li pes 0%.</p>
      <p style="margin:0">Un apartat amb <b>requisit</b> (per exemple «Informe previ entregat») compta com un 0 si desmarques la casella.</p>
    </div>
    <button class="btn danger" id="del-subj">Eliminar l'assignatura</button>`;
  $("e-name").oninput = e => { s.name = e.target.value || "Sense nom"; save(); };
  $("e-code").oninput = e => { s.code = e.target.value.toUpperCase() || "?"; save(); };
  $("del-subj").onclick = () => {
    if (!confirm(`Segur que vols eliminar «${s.name}» i totes les seves notes?`)) return;
    q.subjects = q.subjects.filter(x => x !== s); save(); go(q.id);
  };
  bindTree(q, s);
}

function treeRows(g, depth) {
  let h = "";
  for (const c of g.children) {
    const tags = [];
    if (c.replace) tags.push("substitueix si és més alta");
    if (c.gate) tags.push(`requisit: ${c.gate}`);
    if (c.np) tags.push("compta per NP");
    h += `<div class="trow" style="--d:${depth}" data-edit="${c.id}">
      <span class="ti">${isLeaf(c) ? "•" : "▾"}</span>
      <span class="tn ${isLeaf(c) ? "" : "g"}">${esc(c.name)}${tags.length ? `<small>${esc(tags.join(" · "))}</small>` : ""}</span>
      <span class="tw">${pctW(c.w)}</span><span class="te">✎</span></div>`;
    if (!isLeaf(c)) h += treeRows(c, depth + 1);
  }
  const sw = sumW(g);
  if (g.children.length && Math.abs(sw - 100) > 0.05) h += `<div class="twarn" style="--d:${depth}">⚠ Els pesos ${depth === 0 ? "principals" : `de «${esc(g.name)}»`} sumen ${pctW(sw)} (haurien de sumar 100%)</div>`;
  h += `<div class="tadd" style="--d:${depth}"><button data-add="leaf" data-p="${g.id}">+ Prova</button><button data-add="group" data-p="${g.id}">+ Apartat</button>${g.children.filter(c => !(c.replace && c.w === 0)).length >= 2 ? `<button data-eq="${g.id}">⇆ Repartir igual</button>` : ""}</div>`;
  return h;
}
function bindTree(q, s) {
  const tree = $("tree");
  tree.querySelectorAll("[data-edit]").forEach(r => r.onclick = () => {
    const f = findWithParent(s, r.dataset.edit);
    if (f) openSheet(q, s, f.n, f.p, false);
  });
  tree.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    const p = findWithParent(s, b.dataset.p).n;
    const rest = Math.max(0, Math.round((100 - sumW(p)) * 100) / 100);
    const n = b.dataset.add === "leaf" ? L(uid(), "Nova prova", rest) : G(uid(), "Nou apartat", rest, []);
    openSheet(q, s, n, p, true);
  });
  tree.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => {
    equalize(findWithParent(s, b.dataset.eq).n); save(); refreshTree(q, s);
  });
}
function equalize(g) {
  const ks = g.children.filter(c => !(c.replace && c.w === 0));
  ks.forEach(c => { c.w = 100 / ks.length; });
}
function refreshTree(q, s) { $("tree").innerHTML = treeRows(s, 0); bindTree(q, s); }

/* =================== Full d'edició =================== */
const sheet = $("sheet"), panel = $("sheet-panel");
function closeSheet() { sheet.classList.add("hidden"); panel.innerHTML = ""; }
sheet.querySelector(".sheet-bg").onclick = closeSheet;

function openSheet(q, s, n, p, isNew) {
  const leaf = isLeaf(n);
  const pName = p === s ? null : p.name;
  panel.innerHTML = `
    <h4>${isNew ? (leaf ? "Nova prova" : "Nou apartat") : leaf ? "Editar prova" : "Editar apartat"}</h4>
    <label class="ef"><span>Nom</span><input type="text" id="f-name" value="${esc(n.name)}"></label>
    <label class="ef"><span>Pes (%) ${pName ? `dins de «${esc(pName)}»` : "sobre la nota final"}</span>
      <input type="number" id="f-w" value="${Math.round(n.w * 10000) / 10000}" min="0" max="100" step="any" inputmode="decimal">
      <small>${leaf ? "Posa 0% si és un examen opcional que només substitueix." : "Les proves de dins d'aquest apartat es reparteixen aquest pes."}</small></label>
    <label class="ef"><span>Descripció (opcional)</span><input type="text" id="f-desc" value="${esc(n.desc || "")}" placeholder="Per exemple: temes 1 i 2"></label>
    ${leaf ? `<label class="switch">Si és més alta, substitueix ${pName ? `«${esc(pName)}»` : "tota la nota"}<input type="checkbox" id="f-rep" ${n.replace ? "checked" : ""}></label>`
           : `<label class="switch">Té un requisit (casella sí/no)<input type="checkbox" id="f-gate" ${n.gate ? "checked" : ""}></label>
              <label class="ef ${n.gate ? "" : "hidden"}" id="f-gtext-w"><span>Text del requisit</span><input type="text" id="f-gtext" value="${esc(n.gate || "Informe previ entregat")}"><small>Si el desmarques, l'apartat compta com un 0.</small></label>`}
    <label class="switch">Compta per decidir l'NP<input type="checkbox" id="f-np" ${n.np ? "checked" : ""}></label>
    <p class="wnote" style="margin:0 0 14px">NP: si no et presentes a cap de les proves marcades, la nota és NP.</p>
    ${isNew ? "" : `<div class="row2"><button class="btn" id="f-up">↑ Pujar</button><button class="btn" id="f-down">↓ Baixar</button></div>`}
    <div class="row2"><button class="btn ghost" id="f-cancel">Cancel·lar</button><button class="btn primary" id="f-save">${isNew ? "Afegir" : "Desar"}</button></div>
    ${isNew ? "" : `<button class="btn danger" id="f-del" style="margin-bottom:0">Eliminar ${leaf ? "la prova" : "l'apartat i el seu contingut"}</button>`}`;
  sheet.classList.remove("hidden");
  if (!leaf) $("f-gate").onchange = e => $("f-gtext-w").classList.toggle("hidden", !e.target.checked);
  $("f-cancel").onclick = closeSheet;
  $("f-save").onclick = () => {
    n.name = $("f-name").value.trim() || (leaf ? "Prova" : "Apartat");
    const w = parseFloat(String($("f-w").value).replace(",", "."));
    n.w = isNaN(w) ? 0 : Math.max(0, Math.min(100, w));
    const d = $("f-desc").value.trim();
    if (d) n.desc = d; else delete n.desc;
    if (leaf) { if ($("f-rep").checked) n.replace = true; else delete n.replace; }
    else {
      if ($("f-gate").checked) { n.gate = $("f-gtext").value.trim() || "Requisit complert"; if (n.gateOn === undefined) n.gateOn = true; }
      else { delete n.gate; delete n.gateOn; }
    }
    if ($("f-np").checked) n.np = true; else delete n.np;
    if (isNew) p.children.push(n);
    save(); closeSheet(); refreshTree(q, s);
  };
  if (!isNew) {
    const move = d => {
      const i = p.children.indexOf(n), j = i + d;
      if (j < 0 || j >= p.children.length) return;
      [p.children[i], p.children[j]] = [p.children[j], p.children[i]];
      save(); closeSheet(); refreshTree(q, s);
    };
    $("f-up").onclick = () => move(-1);
    $("f-down").onclick = () => move(1);
    $("f-del").onclick = () => {
      if (!confirm(`Eliminar «${n.name}»${leaf ? "" : " i tot el que conté"}?`)) return;
      p.children = p.children.filter(c => c !== n);
      save(); closeSheet(); refreshTree(q, s);
    };
  }
  if (isNew) setTimeout(() => { $("f-name").focus(); $("f-name").select(); }, 50);
}

route();
</script>
</body>
</html>
